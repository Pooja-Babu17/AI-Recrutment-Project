services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment -d recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://recruitment:recruitment_dev_password@db:5432/recruitment
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  uploads_data:
